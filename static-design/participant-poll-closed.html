<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans%3Awght%40100..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="Participant Poll Closed · Desktop"
      class="box-border w-[900px] h-[760px] flex flex-col gap-0 justify-center items-center bg-[#F3F6F5] overflow-hidden"
    >
      <div
        data-pencil-name="Poll Closed Card"
        class="box-border w-[680px] h-[600px] shrink-0 [box-shadow:0px_12px_28px_0px_#17303422] flex flex-col gap-[18px] p-[32px] justify-start items-center bg-[#FCFDFC] [outline:1px_solid_#D3DFDC] [outline-offset:-0.5px] rounded-[16px]"
      >
        <div
          data-pencil-name="Closed Brand"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[8px] justify-start items-center"
        >
          <div
            data-pencil-name="Closed Brand Mark"
            class="box-border w-[24px] shrink-0 h-[24px] bg-[#1B4C50] rounded-full"
          ></div>
          <div
            data-pencil-name="Closed Brand Name"
            class="text-[18px]/[normal] box-border text-[#173034] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            pulse
          </div>
        </div>
        <div
          data-pencil-name="Closed Context"
          class="text-[10px]/[normal] box-border text-[#1B4C50] font-['DM_Sans',system-ui,sans-serif] font-bold text-center [white-space:nowrap]"
        >
          TEAM OFFSITE · JUNE 2025
        </div>
        <div
          data-pencil-name="Closed Badge"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[7px] p-[7px_10px] justify-start items-center bg-[#E8F0EE] rounded-[20px]"
        >
          <div
            data-pencil-name="Closed Badge Dot"
            class="box-border w-[7px] shrink-0 h-[7px] bg-[#566C6D] rounded-full"
          ></div>
          <div
            data-pencil-name="Closed Badge Label"
            class="text-[11px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            Poll closed
          </div>
        </div>
        <div
          data-pencil-name="Closed Title"
          class="text-[30px]/[normal] box-border text-[#173034] font-['DM_Sans',system-ui,sans-serif] font-bold text-center [white-space:nowrap]"
        >
          This poll is closed.
        </div>
        <div
          data-pencil-name="Closed Body"
          class="text-[15px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-normal text-center [white-space:nowrap]"
        >
          The host is no longer accepting responses.
        </div>
        <div
          data-pencil-name="Closed Response Status"
          class="box-border w-full h-fit shrink-0 flex flex-col gap-[7px] p-[18px] justify-start items-start bg-[#E0EFEC] rounded-[12px]"
        >
          <div
            data-pencil-name="Closed Accepted Label"
            class="text-[13px]/[normal] box-border text-[#2F7A63] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            Your response was accepted before closing.
          </div>
          <div
            data-pencil-name="Closed Accepted Value"
            class="text-[17px]/[normal] box-border text-[#173034] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            Team connection
          </div>
        </div>
        <div
          data-pencil-name="Closed Results State"
          class="text-[13px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-semibold text-center [white-space:nowrap]"
        >
          Results are hidden until the host reveals them.
        </div>
        <div
          data-pencil-name="Closed Next State"
          class="text-[12px]/[normal] box-border text-[#819291] font-['DM_Sans',system-ui,sans-serif] font-normal text-center [white-space:nowrap]"
        >
          Waiting for the next active poll.
        </div>
      </div>
    </div>
  </body>
</html>
