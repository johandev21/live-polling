<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans%3Awght%40100..1000&family=JetBrains+Mono%3Awght%40100..800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="Empty Results · Zero Responses · Desktop"
      class="box-border w-[900px] h-[800px] flex flex-col gap-0 justify-center items-center bg-[#F3F6F5] overflow-hidden"
    >
      <div
        data-pencil-name="Empty Results Card"
        class="box-border w-[680px] h-[680px] shrink-0 [box-shadow:0px_12px_28px_0px_#17303422] flex flex-col gap-[10px] p-[24px] justify-start items-center bg-[#FCFDFC] [outline:1px_solid_#D3DFDC] [outline-offset:-0.5px] rounded-[16px]"
      >
        <div
          data-pencil-name="Empty Results Brand"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[8px] justify-start items-center"
        >
          <div
            data-pencil-name="Empty Results Brand Mark"
            class="box-border w-[24px] shrink-0 h-[24px] bg-[#1B4C50] rounded-full"
          ></div>
          <div
            data-pencil-name="Empty Results Brand Name"
            class="text-[18px]/[normal] box-border text-[#173034] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            pulse
          </div>
        </div>
        <div
          data-pencil-name="Empty Results Context"
          class="text-[10px]/[normal] box-border text-[#1B4C50] font-['DM_Sans',system-ui,sans-serif] font-bold text-center [white-space:nowrap]"
        >
          HOST RESULTS · SINGLE-CHOICE POLL
        </div>
        <div
          data-pencil-name="Empty Results Badge"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[7px] p-[7px_10px] justify-start items-center bg-[#E8F0EE] rounded-[20px]"
        >
          <div
            data-pencil-name="Empty Results Badge Dot"
            class="box-border w-[7px] shrink-0 h-[7px] bg-[#566C6D] rounded-full"
          ></div>
          <div
            data-pencil-name="Empty Results Badge Label"
            class="text-[11px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            No responses
          </div>
        </div>
        <div
          data-pencil-name="Empty Results Title"
          class="text-[28px]/[normal] box-border text-[#173034] font-['DM_Sans',system-ui,sans-serif] font-bold text-center [white-space:nowrap]"
        >
          No responses yet
        </div>
        <div
          data-pencil-name="Empty Results Body"
          class="text-[15px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-normal text-center [white-space:nowrap]"
        >
          There are no effective responses for this poll.
        </div>
        <div
          data-pencil-name="Empty Results Visualization"
          class="box-border w-full h-[80px] shrink-0 flex flex-row gap-[10px] justify-center items-center bg-[#F3F6F5] rounded-[12px]"
        >
          <svg
            data-pencil-name="Empty Results Icon"
            data-icon-name="chart-bar"
            data-icon-set="lucide"
            viewBox="0 0 13.99993896484375 14"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
            class="box-border w-[28px] shrink-0 h-[28px]"
          >

              fill="#819291"
            ></path>
          </svg>
          <div
            data-pencil-name="Empty Results Chart Label"
            class="text-[12px]/[normal] box-border text-[#819291] font-['JetBrains_Mono',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            0 total responses
          </div>
        </div>
        <div
          data-pencil-name="Empty Results Host Note"
          class="text-[12px]/[normal] box-border w-full text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-normal text-center"
        >
          You can reveal results even when the response count is zero. Participants will see the
          empty state once results are revealed.
        </div>
      </div>
    </div>
  </body>
</html>
