<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans%3Awght%40100..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="Participant Response Accepted · Desktop"
      class="box-border w-[900px] h-[820px] flex flex-col gap-0 justify-center items-center bg-[#F3F6F5] overflow-hidden"
    >
      <div
        data-pencil-name="Response Accepted Card"
        class="box-border w-[680px] h-[650px] shrink-0 [box-shadow:0px_12px_28px_0px_#17303422] flex flex-col gap-[18px] p-[32px] justify-start items-center bg-[#FCFDFC] [outline:1px_solid_#D3DFDC] [outline-offset:-0.5px] rounded-[16px]"
      >
        <div
          data-pencil-name="Accepted Brand"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[8px] justify-start items-center"
        >
          <div
            data-pencil-name="Accepted Brand Mark"
            class="box-border w-[24px] shrink-0 h-[24px] bg-[#1B4C50] rounded-full"
          ></div>
          <div
            data-pencil-name="Accepted Brand Name"
            class="text-[18px]/[normal] box-border text-[#173034] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            pulse
          </div>
        </div>
        <div
          data-pencil-name="Accepted Context"
          class="text-[10px]/[normal] box-border text-[#1B4C50] font-['DM_Sans',system-ui,sans-serif] font-bold text-center [white-space:nowrap]"
        >
          TEAM OFFSITE · JUNE 2025
        </div>
        <div
          data-pencil-name="Accepted Badge"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[7px] p-[7px_10px] justify-start items-center bg-[#E7F6F0] rounded-[20px]"
        >
          <div
            data-pencil-name="Accepted Badge Dot"
            class="box-border w-[7px] shrink-0 h-[7px] bg-[#2F7A63] rounded-full"
          ></div>
          <div
            data-pencil-name="Accepted Badge Label"
            class="text-[11px]/[normal] box-border text-[#2F7A63] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            Response accepted
          </div>
        </div>
        <div
          data-pencil-name="Accepted Title"
          class="text-[28px]/[normal] box-border text-[#173034] font-['DM_Sans',system-ui,sans-serif] font-bold text-center [white-space:nowrap]"
        >
          Your response is in.
        </div>
        <div
          data-pencil-name="Accepted Body"
          class="text-[15px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-normal text-center [white-space:nowrap]"
        >
          The server confirmed your response to this poll.
        </div>
        <div
          data-pencil-name="Accepted Current Response"
          class="box-border w-full h-fit shrink-0 flex flex-col gap-[7px] p-[18px] justify-start items-start bg-[#E0EFEC] rounded-[12px]"
        >
          <div
            data-pencil-name="Accepted Poll Question"
            class="text-[13px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
          >
            What should we make more time for?
          </div>
          <div
            data-pencil-name="Accepted Response Value"
            class="text-[18px]/[normal] box-border text-[#1B4C50] font-['DM_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            Team connection
          </div>
        </div>
        <div
          data-pencil-name="Change Accepted Response"
          class="box-border w-full h-fit shrink-0 flex flex-row gap-[8px] p-[12px_18px] justify-center items-center bg-[#1B4C50] rounded-[8px]"
        >
          <svg
            data-pencil-name="Button Icon"
            data-icon-name="pencil"
            data-icon-set="lucide"
            viewBox="0 0 13.99993896484375 14"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
            class="box-border w-[16px] shrink-0 h-[16px]"
          >
            <path
              d="M11.00244 0.60156q-0.61523 0.04102-1.14502 0.43408-0.15381 0.09912-4.13232 4.0879-3.9751 3.98877-4.08789 4.1289-0.14014 0.19824-0.23242 0.45801-0.08887 0.25635-0.44776 1.46289-0.35547 1.20313-0.36914 1.28516-0.01367 0.12646 0.02051 0.27343 0.03418 0.14697 0.08887 0.2461 0.05811 0.09912 0.17089 0.20507 0.11279 0.10254 0.2085 0.14698 0.09912 0.04102 0.22559 0.06836 0.12646 0.02734 0.229 0.01367 0.10596-0.01367 1.38086-0.39307l1.24756-0.38964q0.26318-0.08545 0.3623-0.12647l0.01367-0.01367q0.14014-0.07178 0.32129-0.22559 0.25293-0.23926 1.08008-1.04932l2.92578-2.92578q3.98877-3.99219 4.10156-4.14599 0.18115-0.24951 0.29395-0.51612 0.23926-0.60156 0.11963-1.23046-0.11963-0.63232-0.56738-1.10743-0.35205-0.36572-0.81348-0.54687-0.46143-0.18115-0.99463-0.14014z m0.42041 1.17578q0.28027 0.05811 0.50928 0.29053 0.23242 0.229 0.29053 0.50928 0.08203 0.37598-0.08545 0.71435-0.04102 0.08203-0.1333 0.18116-0.08887 0.0957-0.42725 0.44775l-0.50244 0.50244-1.49707-1.49707 0.50244-0.50244q0.35205-0.33838 0.44775-0.42725 0.09912-0.09229 0.18116-0.1333 0.33838-0.16748 0.71435-0.08545z m-4.2417 6.53858q-3.07959 3.07959-3.14453 3.11719-0.06152 0.03418-1.0835 0.34863-1.02197 0.31445-1.03564 0.30762-0.01367-0.00683 0.29395-1.02881 0.30762-1.02197 0.33496-1.06983 0.03076-0.05127 3.12402-3.1582l3.09326-3.09326 1.4834 1.49707-3.06592 3.07959z"
              fill="#FFFFFF"
            ></path>
          </svg>
          <div
            data-pencil-name="Button Label"
            class="text-[14px]/[normal] box-border text-[#FFFFFF] font-['DM_Sans',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
          >
            Change response
          </div>
        </div>
        <div
          data-pencil-name="Accepted Edit Note"
          class="text-[12px]/[normal] box-border text-[#819291] font-['DM_Sans',system-ui,sans-serif] font-normal text-center [white-space:nowrap]"
        >
          You can change your response while the poll remains open.
        </div>
        <div
          data-pencil-name="Accepted Results Note"
          class="text-[12px]/[normal] box-border text-[#566C6D] font-['DM_Sans',system-ui,sans-serif] font-semibold text-center [white-space:nowrap]"
        >
          Results will appear when the host reveals them.
        </div>
      </div>
    </div>
  </body>
</html>
